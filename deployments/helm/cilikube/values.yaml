app:
  name: cilikube

backend:
  image:
    repository: ghcr.io/ciliverse/cilikube
    tag: v1.5.0
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  image:
    repository: ghcr.io/ciliverse/cilikube-web
    tag: v1.5.0
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""

rbac:
  create: true

ingress:
  enabled: false
  className: nginx
  host: cilikube.local

config:
  serverMode: release
  jwtExpire: 24h0m0s

secrets:
  # REQUIRED in release: JWT >=16 chars; encryptionKey exactly 32 chars. Known defaults are refused at startup.
  jwtSecret: REPLACE_WITH_STRONG_JWT_SECRET
  encryptionKey: REPLACE_WITH_32_CHAR_ENC_KEY!!

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
